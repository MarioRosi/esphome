# Die Device-Yaml für die Rolladensteuerung
# LAN MAC F0:24:F9:5A:F7:7F
# WIFI MAC F0:24:F9:5A:F7:7C
substitutions:
  mydelay_on: 50ms
  mydelay_off: 300ms

esphome:
  name: roller-shutter-1
  friendly_name: Roller_Shutter_1
  on_boot: 
    priority: -100
    then:
      - lambda: |-          
          id(rollershutter_1).MySetup();
          id(rollershutter_1).InitialRun();

esp32:
  board: esp32dev
  framework:
    type: esp-idf

debug:

# Logger must be at least debug (default)
logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key1

ota:
  - platform: esphome
    password: !secret ota_password1

#wifi:
#  ssid: !secret wifi_ssid
#  password: !secret wifi_password
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  manual_ip:
    static_ip: 192.168.50.120
    gateway: 192.168.50.2
    subnet: 255.255.255.0
    dns1: 192.168.50.2

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

uart:
  - id: rs485
    tx_pin: GPIO13
    rx_pin: GPIO16
    baud_rate: 9600

i2c:
  sda: GPIO4
  scl:
    number: GPIO5
    ignore_strapping_warning: true

text_sensor:
  - platform: template
    name: RL_Hausanschluss
  - platform: template
    name: RL_Kueche
  - platform: template
    name: RL_Bad_Kinder
  - platform: template
    name: RL_KiZi_1
  - platform: template
    name: RL_KiZi_2
  - platform: template
    name: RL_Arbeit
  - platform: template
    name: RL_Stube_Ter_Tuer
  - platform: template
    name: RL_Stube_Terrasse

pcf8574:
  - id: inputs_1_8
    address: 0x22
    pcf8575: false
  - id: inputs_9_16
    address: 0x21
    pcf8575: false
  - id: outputs_1_8
    address: 0x24
    pcf8575: false
  - id: outputs_9_16
    address: 0x25
    pcf8575: false

binary_sensor:
  - platform: gpio
    name: "KC868-A16-HT1"
    pin:
      number: GPIO32
      inverted: true

  - platform: gpio
    name: "KC868-A16-HT2"
    pin:
      number: GPIO33
      inverted: true

  - platform: gpio
    name: "KC868-A16-HT3"
    pin:
      number: GPIO14
      inverted: true

  - platform: gpio
    name: "RL_HAR_I_U"
    pin:
      pcf8574: inputs_1_8
      number: 0
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_HAR_I_D"
    pin:
      pcf8574: inputs_1_8
      number: 1
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_KIT_I_U"
    pin:
      pcf8574: inputs_1_8
      number: 2
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_KIT_I_D"
    pin:
      pcf8574: inputs_1_8
      number: 3
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_BA1_I_U"
    pin:
      pcf8574: inputs_1_8
      number: 4
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_BA1_I_D"
    pin:
      pcf8574: inputs_1_8
      number: 5
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: $mydelay_on
      - delayed_off: $mydelay_off     

  - platform: gpio
    name: "RL_KI1_I_U"
    pin:
      pcf8574: inputs_1_8
      number: 6
      mode: INPUT
      inverted: true
    filters:
