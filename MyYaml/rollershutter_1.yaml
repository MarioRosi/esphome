external_components:
  - source: 
      type: git
      url: https://github.com/MarioRosi/esphome
      ref: dev
    components: [ rollershutter ]
    refresh: 0d

rollershutter:
  id: rollershutter_1
  name: rollershutter-1

  rstimes:
    - id: TIME_NORMAL
      secondsup: 19.0
      secondsdown: 18.0
      secondsgap: 14.0

    - id: TIME_BIGWINDOW
      secondsup: 24.0
      secondsdown: 22.0
      secondsgap: 17.0

    - id: TIME_BIGDOOR
      secondsup: 27.0
      secondsdown: 28.0
      secondsgap: 17.0

  rsgroups:
    - id: HOUSE_SOUTH
      name: haus-sued
      sundowner:
        monthfrom: 5
        monthto: 9
        gaphour: 8
        gapminute: 0
        uphour: 15
        upminute: 45

    - id: HOUSE_NORTH
      name: haus-nord
      sundowner:
        offline: 1

    - id: HOUSE_EAST
      name: haus-ost
      sundowner:
        monthfrom: 5
        monthto: 9
        gaphour: 6
        gapminute: 30
        uphour: 11
        upminute: 0

    - id: HOUSE_WEST
      name: haus-west
      sundowner:
        monthfrom: 5
        monthto: 9
        gaphour: 13
        gapminute: 40
        uphour: 18
        upminute: 55

  rshutterAll:
    allinputup_id: remote
    allinputdown_id: remote
    allinputhollyday_id: remote
    allinput_master: False
    allinput_slave: True

  rshutters:
    - id: rs_har
      name: hausanschlussraum
      rsgroup_id: HOUSE_SOUTH
      rstime_id: TIME_NORMAL
      inputup_id: rl_har_i_u
      inputdown_id: rl_har_i_d
      outputup_id: rl_har_o_u
      outputdown_id: rl_har_o_d
      display_id: rl_hausanschluss

    - id: rs_kit
      name: kueche
      rsgroup_id: HOUSE_SOUTH
      rstime_id: TIME_NORMAL
      inputup_id: rl_kit_i_u
      inputdown_id: rl_kit_i_d
      outputup_id: rl_kit_o_u
      outputdown_id: rl_kit_o_d
      display_id: rl_kueche

    - id: rs_ba1
      name: kinderbad
      rsgroup_id: HOUSE_SOUTH
      rstime_id: TIME_NORMAL
      inputup_id: rl_ba1_i_u
      inputdown_id: rl_ba1_i_d
      outputup_id: rl_ba1_o_u
      outputdown_id: rl_ba1_o_d
      display_id: rl_bad_kinder

    - id: rs_ki1
      name: kinderzimmer
      rsgroup_id: HOUSE_SOUTH
      rstime_id: TIME_NORMAL
      inputup_id: rl_ki1_i_u
      inputdown_id: rl_ki1_i_d
      outputup_id: rl_ki1_o_u
      outputdown_id: rl_ki1_o_d
      display_id: rl_kizi_1

    - id: rs_ki2
      name: kinder-schlafen
      rsgroup_id: HOUSE_WEST
      rstime_id: TIME_NORMAL
      inputup_id: rl_ki2_i_u
      inputdown_id: rl_ki2_i_d
      outputup_id: rl_ki2_o_u
      outputdown_id: rl_ki2_o_d
      display_id: rl_kizi_2

    - id: rs_arb
      name: arbeitsplatz
      rsgroup_id: HOUSE_WEST
      rstime_id: TIME_NORMAL
      inputup_id: rl_arb_i_u
      inputdown_id: rl_arb_i_d
      outputup_id: rl_arb_o_u
      outputdown_id: rl_arb_o_d
      display_id: rl_arbeit

    - id: rs_stt
      name: stube-terassentuer
      rsgroup_id: HOUSE_WEST
      rstime_id: TIME_BIGDOOR
      inputup_id: rl_stt_i_u
      inputdown_id: rl_stt_i_d
      outputup_id: rl_stt_o_u
      outputdown_id: rl_stt_o_d
      display_id: rl_stube_ter_tuer

    - id: rs_stf
      name: stube-terassenfenster
      rsgroup_id: HOUSE_WEST
      rstime_id: TIME_BIGWINDOW
      inputup_id: rl_stf_i_u
      inputdown_id: rl_stf_i_d
      outputup_id: rl_stf_o_u
      outputdown_id: rl_stf_o_d
      display_id: rl_stube_terrasse
